services:
  - type: web
    name: sounre
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker on purpose: the MusicBrainz limiter and the per-IP budget live in this process.
    startCommand: uvicorn app.main:create_app --factory --host 0.0.0.0 --port $PORT --workers 1 --no-server-header
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8   # check Render's currently supported 3.12.x and adjust
      - key: SOUNRE_CONTACT
        sync: false     # type it in the dashboard: your site URL, e.g. https://sounre.onrender.com
      - key: SOUNRE_CACHE_DIR
        value: /tmp/sounre-cache   # free plan disk is ephemeral; the cache simply starts empty after a restart
      - key: SOUNRE_PROXY
        value: forwarded
      - key: SOUNRE_PROXY_HOPS
        value: "2"      # X-Forwarded-For: <visitor-supplied...>, <real visitor>, <Cloudflare edge>
